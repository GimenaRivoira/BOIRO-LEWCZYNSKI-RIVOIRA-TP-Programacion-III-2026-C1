<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nombreInicio</title>
    <link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
  crossorigin="anonymous"
/>
    <link rel="stylesheet" href="./nombre.css" />
    <link rel="stylesheet" href="../common/darkmode.css" />
    
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
   <div class="position-absolute top-0 end-0 p-3 d-flex gap-2">

  
  <button
    type="button"
    class="btn btn-outline-secondary btn-sm bi bi-brightness-high"
    id="mode-toggler"
    title="Cambiar a modo oscuro"
  ></button>

  <button
    type="button"
    class="btn btn-outline-secondary btn-sm"
    id="btnAdmin"
    title="Administrador"
  >
    <i class="bi bi-person-circle fs-6"></i>
  </button>

</div>

      <div class="row min-vh-100 justify-content-center align-items-center">
        <div class="col-11 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
          <div class="container-form">
            <form id="formNombre">
              <div class="mb-3 text-center">
                <img
                  src="../img/logoSimple.png"
                  alt="Logo Florea"
                  class="logo-florea img-fluid"
                />

                <label for="nombre" class="form-label fst-italic">
                  Bienvenido a florea!
                </label>

                <input
                  type="text"
                  id="nombre"
                  class="form-control"
                  placeholder="Ingrese su nombre"
                />
              </div>

              <div class="d-grid gap-2">
                <button type="button" class="btn btn-primary" id="botonEntrar">
                  Enviar
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  <script src="./nombre.js"></script>
<script src="../common/darkmode.js"></script>
  </body>
</html>
