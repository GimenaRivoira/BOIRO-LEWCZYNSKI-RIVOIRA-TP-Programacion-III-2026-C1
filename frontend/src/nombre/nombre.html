<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nombreInicio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./nombre.css" />
  </head>
  <body>
    <div class="container-fluid min-vh-100">
      <div class="row min-vh-100 justify-content-center align-items-center">
        <div class="col-11 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
          <div class="container-form">
            <form id="formNombre">
              <div class="mb-3 text-center">
                <img
                  src="../img/logoSimple.png"
                  alt="Logo Florea"
                  class="logo-florea img-fluid"
                />

                <label for="nombre" class="form-label fst-italic">
                  Bienvenido a florea!
                </label>

                <input
                  type="text"
                  id="nombre"
                  class="form-control"
                  placeholder="Ingrese su nombre"
                />
              </div>

              <div class="d-grid gap-2">
                <button type="button" class="btn btn-primary" id="botonEntrar">Enviar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="./nombre.js"></script>
  </body>
</html>
