<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio</title>
    <!-- Bootstrap 5.3.2 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="inicio.css" />
    <link rel="stylesheet" href="../common/darkmode.css" />
    <link rel="stylesheet" href="../common/nav.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <nav
      class="navbar navbar-expand-md navbar-florea fixed-top bg-light shadow-sm"
    >
      <div class="container-fluid px-5">
        <a href="../inicio/inicio.html" class="btn btn-florea"> ← </a>

        <!-- Logo / Marca -->
        <a class="navbar-brand" href="../inicio/inicio.html">
          <img src="../img/logoSimple.png" alt="Logo FLOREA" width="100" />
        </a>

        <!-- Botón Toggler para celulares -->
        <button
          class="navbar-toggler shadow-none border-0"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasNavbar"
          aria-controls="offcanvasNavbar"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Contenedor Offcanvas para adaptabilidad móvil -->
        <div
          class="offcanvas offcanvas-end"
          tabindex="-1"
          id="offcanvasNavbar"
          aria-labelledby="offcanvasNavbarLabel"
        >
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menú</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="offcanvas"
              aria-label="Close"
            ></button>
          </div>
          <div
            class="offcanvas-body d-flex justify-content-center align-items-center"
          >
            <ul
              class="navbar-nav justify-content-center align-items-center w-100 h-100 gap-5"
            >
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="../inicio/inicio.html"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../productos/productos.html"
                  >Flores</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="../productos/productos.html"
                  role="button"
                  >Velas</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="../carrito/carrito.html"
                  role="button"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    class="bi bi-cart"
                    viewBox="0 0 16 16"
                  >
                    <path
                      d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"
                    />
                  </svg>
                </a>
              </li>
              <!-- bi-brightness-high / bi-moon se intercambian desde index.js -->
              <li class="nav-item">
                <a
                  class="bi bi-brightness-high fs-5 ms-auto"
                  id="mode-toggler"
                  role="button"
                >
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <!-- ===== PRODUCTOS CATEGORIAS ===== -->
    <main class="cardsRecomendados" style="margin-top: 100px">
      <div class="tituloCard text-center my-4">
        <h2>NUESTRAS CATEGORIAS</h2>
      </div>
      <div
        class="destacadoRecomendados d-flex justify-content-center gap-4 flex-wrap"
      >
        <div class="card" style="width: 18rem">
          <img
            src="../img/velaCardInicial.jpg"
            class="card-img-top"
            alt="Velas"
          />
          <div class="card-body d-flex flex-column">
            <h5 class="card-title text-center">VELAS</h5>
            <a
              href="../productos/productos.html?tipo=velas"
              class="btn btn-primary mt-auto"
              style="
                background-color: #2d4f44;
                letter-spacing: 1px;
                font-size: 0.9rem;
                font-weight: 600;
              "
              >VER MÁS</a
            >
          </div>
        </div>
        <div class="card" style="width: 18rem">
          <img
            src="../img/florCardInicial.jpg"
            class="card-img-top"
            alt="Flores"
          />
          <div class="card-body d-flex flex-column">
            <h5 class="card-title text-center">FLORES</h5>
            <a
              href="../productos/productos.html?tipo=flores"
              class="btn btn-primary mt-auto"
              style="
                background-color: #2d4f44;
                letter-spacing: 1px;
                font-size: 0.9rem;
                font-weight: 600;
              "
              >VER MÁS</a
            >
          </div>
        </div>
      </div>
    </main>

    <div class="placeholder-footer-header text-center my-5">
      ACA VA EL FOOTER
    </div>

    <!-- Bootstrap 5.3.2 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../common/darkmode.js"></script>
  </body>
</html>
